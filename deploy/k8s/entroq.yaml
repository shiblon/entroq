apiVersion: v1
kind: Service
metadata:
  name: entroq
spec:
  ports:
    - name: grpc
      port: 37706
      targetPort: 37706
    - name: http
      port: 9100
      targetPort: 9100
  selector:
    app: entroq
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: entroq
spec:
  replicas: 3
  selector:
    matchLabels:
      app: entroq
  template:
    metadata:
      labels:
        app: entroq
    spec:
      containers:
        - name: entroq
          image: ghcr.io/shiblon/entroq-pg:latest
          command:
            - "/bin/eqpg"
            - "serve"
            # Applies or upgrades the schema, then serves. Idempotent, so it is
            # safe on every start; the chart does the same. (An init container
            # cannot run serve: it never exits.)
            - "--init_schema"
            - "--dbaddr=postgres:5432"
            - "--dbuser=entroq"
            - "--dbname=entroq"
            - "--readiness_interval=5s"
          ports:
            - containerPort: 37706
              name: grpc
            - containerPort: 9100
              name: http
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: postgres-password
          readinessProbe:
            tcpSocket:
              port: 37706
            initialDelaySeconds: 5
            periodSeconds: 10
