apiVersion: apps/v1
kind: Deployment
metadata:
  name: entroq-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: entroq-worker
  template:
    metadata:
      labels:
        app: entroq-worker
    spec:
      containers:
        - name: worker
          # The service images carry eqc. This one copies each task's value
          # from /work/inbox to /work/done; replace cat with your command.
          image: ghcr.io/shiblon/entroq-pg:latest
          command:
            - "/bin/eqc"
            - "--svcaddr=entroq:37706"
            - "work"
            - "--queue=/work/inbox"
            - "--out-queue=/work/done"
            - "--"
            - "/busybox/cat"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
