apiVersion: apps/v1
kind: Deployment
metadata:
  name: direct-auth
  namespace: mesh-bench
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mesh-benchmark
      app.kubernetes.io/component: direct-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mesh-benchmark
        app.kubernetes.io/component: direct-auth
    spec:
      serviceAccountName: gateway
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: mesh-benchmark
                app.kubernetes.io/component: gateway
            topologyKey: kubernetes.io/hostname
      containers:
      - name: proxy
        image: entroq-mesh-workload:@IMAGE_TAG@
        imagePullPolicy: Never
        args:
        - auth-proxy
        - --addr=:8080
        - --upstream-url=http://leaf-direct.mesh-bench.svc.cluster.local:8080/work
        - --service=leaf
        - --namespace=mesh-bench
        - --domain-suffix=.localhost
        - --authz-token-file=/var/run/secrets/kubernetes.io/serviceaccount/token
        - --opa-url=http://entroq.entroq-system.svc.cluster.local:8181
        - --opa-path=@OPA_PATH@
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: direct-auth
  namespace: mesh-bench
spec:
  selector:
    app.kubernetes.io/name: mesh-benchmark
    app.kubernetes.io/component: direct-auth
  ports:
  - name: http
    port: 8080
    targetPort: http
