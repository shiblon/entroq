apiVersion: v1
kind: Namespace
metadata:
  name: mesh-bench
---
apiVersion: v1
kind: Service
metadata:
  name: entroq-metrics
  namespace: entroq-system
spec:
  selector:
    app.kubernetes.io/name: entroq
    app.kubernetes.io/component: server
  ports:
  - name: metrics
    port: 9100
    targetPort: 9100
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  namespace: mesh-bench
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: relay
  namespace: mesh-bench
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: leaf
  namespace: mesh-bench
---
apiVersion: entroq.entroq.io/v1alpha1
kind: EntroQIdentity
metadata:
  name: mesh-benchmark-identities
  namespace: mesh-bench
spec:
  identities:
  - serviceAccount: gateway
    labels:
      role: gateway
  - serviceAccount: relay
    labels:
      role: relay
  - serviceAccount: leaf
    labels:
      role: leaf
---
apiVersion: entroq.entroq.io/v1alpha1
kind: EntroQQueue
metadata:
  name: mesh-benchmark-policy
  namespace: mesh-bench
spec:
  queues:
  - pattern: /mesh-bench/relay/inbox
    matchType: Exact
    allowedCallers:
    - labels:
        role: gateway
  - pattern: /mesh-bench/leaf/inbox
    matchType: Exact
    allowedCallers:
    - labels:
        role: gateway
    - labels:
        role: relay
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: mesh-bench
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mesh-benchmark
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mesh-benchmark
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: entroq-mesh-benchmark
    spec:
      serviceAccountName: gateway
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/part-of: entroq-mesh-benchmark
            topologyKey: kubernetes.io/hostname
      containers:
      - name: eqlink
        image: entroq-link:@IMAGE_TAG@
        imagePullPolicy: Never
        args:
        - send
        - --entroq=entroq.entroq-system.svc.cluster.local:37706
        - --namespace=mesh-bench
        - --domain-suffix=.localhost
        - --authz-token-file=/var/run/secrets/kubernetes.io/serviceaccount/token
        - --metrics_addr=:9090
        ports:
        - name: http
          containerPort: 8080
        - name: metrics
          containerPort: 9090
        readinessProbe:
          httpGet:
            path: /metrics
            port: metrics
          periodSeconds: 2
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-mesh
  namespace: mesh-bench
spec:
  selector:
    app.kubernetes.io/name: mesh-benchmark
    app.kubernetes.io/component: gateway
  ports:
  - name: http
    port: 8080
    targetPort: http
  - name: metrics
    port: 9090
    targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: mesh-bench
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mesh-benchmark
      app.kubernetes.io/component: relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mesh-benchmark
        app.kubernetes.io/component: relay
        app.kubernetes.io/part-of: entroq-mesh-benchmark
    spec:
      serviceAccountName: relay
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/part-of: entroq-mesh-benchmark
            topologyKey: kubernetes.io/hostname
      containers:
      - name: app
        image: entroq-mesh-workload:@IMAGE_TAG@
        imagePullPolicy: Never
        args:
        - serve
        - --addr=:8000
        - --upstream-url=http://localhost:8080/work
        - --upstream-host=leaf.localhost
        ports:
        - name: app
          containerPort: 8000
        readinessProbe:
          httpGet:
            path: /healthz
            port: app
          periodSeconds: 2
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
      - name: eqlink
        image: entroq-link:@IMAGE_TAG@
        imagePullPolicy: Never
        args:
        - run
        - --entroq=entroq.entroq-system.svc.cluster.local:37706
        - --queue=/mesh-bench/relay
        - --namespace=mesh-bench
        - --domain-suffix=.localhost
        - --upstream=http://localhost:8000
        - --concurrency=8
        - --authz-token-file=/var/run/secrets/kubernetes.io/serviceaccount/token
        - --metrics_addr=:9090
        ports:
        - name: metrics
          containerPort: 9090
        readinessProbe:
          httpGet:
            path: /metrics
            port: metrics
          periodSeconds: 2
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: relay-metrics
  namespace: mesh-bench
spec:
  selector:
    app.kubernetes.io/name: mesh-benchmark
    app.kubernetes.io/component: relay
  ports:
  - name: metrics
    port: 9090
    targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: leaf
  namespace: mesh-bench
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mesh-benchmark
      app.kubernetes.io/component: leaf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mesh-benchmark
        app.kubernetes.io/component: leaf
        app.kubernetes.io/part-of: entroq-mesh-benchmark
    spec:
      serviceAccountName: leaf
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/part-of: entroq-mesh-benchmark
            topologyKey: kubernetes.io/hostname
      containers:
      - name: app
        image: entroq-mesh-workload:@IMAGE_TAG@
        imagePullPolicy: Never
        args:
        - serve
        - --addr=:8000
        ports:
        - name: app
          containerPort: 8000
        readinessProbe:
          httpGet:
            path: /healthz
            port: app
          periodSeconds: 2
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
      - name: eqlink
        image: entroq-link:@IMAGE_TAG@
        imagePullPolicy: Never
        args:
        - recv
        - --entroq=entroq.entroq-system.svc.cluster.local:37706
        - --queue=/mesh-bench/leaf
        - --upstream=http://localhost:8000
        - --concurrency=8
        - --authz-token-file=/var/run/secrets/kubernetes.io/serviceaccount/token
        - --metrics_addr=:9090
        ports:
        - name: metrics
          containerPort: 9090
        readinessProbe:
          httpGet:
            path: /metrics
            port: metrics
          periodSeconds: 2
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: leaf-direct
  namespace: mesh-bench
spec:
  selector:
    app.kubernetes.io/name: mesh-benchmark
    app.kubernetes.io/component: leaf
  ports:
  - name: http
    port: 8080
    targetPort: app
  - name: metrics
    port: 9090
    targetPort: metrics
