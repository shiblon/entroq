services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=entroq
      - POSTGRES_USER=entroq
      - POSTGRES_PASSWORD=entroq
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entroq -d entroq"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  entroq:
    build:
      context: .
      dockerfile: ./cmd/eqpg/Dockerfile
    environment:
      - PGPASSWORD=entroq
    ports:
      - "37706:37706"
      - "9100:9100"
    depends_on:
      postgres:
        condition: service_healthy
    command: 
      - "serve"
      - "--dbaddr=postgres:5432"
      - "--dbname=entroq"
      - "--dbuser=entroq"
      # Applies the schema and records its digest, which eqpg.Open requires;
      # a schema loaded by postgres's own init scripts has none.
      - "--init_schema"
      - "--readiness_interval=5s"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yaml:/etc/prometheus/prometheus.yml
    depends_on:
      - entroq

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning
      - ./deploy/grafana/entroq-dashboard.json:/var/lib/grafana/dashboards/entroq-dashboard.json
    depends_on:
      - prometheus
