# Default values for the EntroQ mesh chart.
# Override with: helm install entroq ./charts/entroq -f my-values.yaml
# or:           helm install entroq ./charts/entroq --set key=value

# -- Operator: watches EntroQQueue and EntroQIdentity CRDs, pushes mesh policy.
operator:
  enabled: true
  image:
    repository: ghcr.io/shiblon/entroq-operator
    tag: ""            # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  # Blank selects the in-chart EntroQ or OPA endpoint for the chosen strategy.
  meshUrl: ""
  resyncInterval: 5m
  meshConfigMapNamespace: entroq-system
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi

# -- EntroQ server and authorization policy.
entroq:
  enabled: true

  # Authorization strategy. mesh uses EntroQ's native Kubernetes label policy;
  # opahttp runs the bundled OPA sidecar; none is explicitly unsecured.
  authorization:
    strategy: mesh
    opaUrl: "http://localhost:8181"
    opaPath: ""

  # Storage backend. One of:
  #   memory    -- in-process only; data lost on restart (Deployment, no PVC)
  #   journal   -- in-process with WAL journal; durable (StatefulSet + PVC)
  #   postgres  -- PostgreSQL; configure entroq.postgres below
  #   redis     -- Redis (experimental); configure entroq.redis below
  backend:
    type: memory

  # Images for each backend. Tag defaults to .Chart.AppVersion when left blank.
  images:
    mem:       # used for memory and journal backends (same binary)
      repository: ghcr.io/shiblon/entroq-mem
      tag: ""
    postgres:
      repository: ghcr.io/shiblon/entroq-pg
      tag: ""
    redis:
      repository: ghcr.io/shiblon/entroq-redis
      tag: ""
    pullPolicy: IfNotPresent

  # Journal storage (backend.type=journal only).
  storage:
    size: 1Gi
    storageClass: ""   # blank = cluster default StorageClass
    mountPath: /data/entroq/journal

  # PostgreSQL connection (backend.type=postgres only).
  postgres:
    addr: "postgres:5432"
    database: entroq
    user: entroq
    password: ""          # chart creates a Secret from this value
    existingSecret: ""    # use a pre-existing Secret instead (recommended for production)
    initSchema: true      # idempotent; safe to leave enabled

  # Redis connection (backend.type=redis, experimental).
  redis:
    addr: "redis:6379"
    password: ""          # chart creates a Secret from this value
    existingSecret: ""    # use a pre-existing Secret instead (recommended for production)
    db: 0

  # Optional external-policy OPA sidecar, used only with strategy=opahttp.
  opa:
    image:
      repository: openpolicyagent/opa
      tag: "1.16.2"
      pullPolicy: IfNotPresent
    # decisionLogs: true   # emit structured auth decisions to stdout (verbose)
    # debug: true          # debug-level OPA authorization logging

  # Kubernetes JWT authentication performed by the EntroQ service.
  # Obtain cluster-specific values from:
  #   kubectl get --raw /.well-known/openid-configuration
  auth:
    jwksUrl: "https://kubernetes.default.svc/openid/v1/jwks"
    # Clear this when jwksUrl is a public endpoint outside the cluster.
    jwksTokenFile: "/var/run/secrets/kubernetes.io/serviceaccount/token"
    audience: "https://kubernetes.default.svc.cluster.local"
    issuer:   "https://kubernetes.default.svc.cluster.local"
    caFile:   "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    tokenCacheTTL: 30s
    tokenCacheEntries: 4096
    jwksCacheTTL: 5m
    jwksRefreshInterval: 5s
    httpTimeout: 10s

  service:
    grpcPort: 37706
    httpPort: 9100
    opaPort: 8181

  resources:
    entroq:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    opa:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
