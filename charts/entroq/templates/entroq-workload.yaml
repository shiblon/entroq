{{- if .Values.entroq.enabled -}}
{{- $authzStrategy := .Values.entroq.authorization.strategy -}}
{{- if not (has $authzStrategy (list "none" "mesh" "opahttp")) -}}
{{- fail (printf "entroq.authorization.strategy must be none, mesh, or opahttp, got %q" $authzStrategy) -}}
{{- end -}}
{{- $usesAuthz := ne $authzStrategy "none" -}}
{{- $usesMesh := eq $authzStrategy "mesh" -}}
{{- $usesOPA := eq $authzStrategy "opahttp" -}}
{{- $backend := .Values.entroq.backend.type -}}
{{- $isJournal  := eq $backend "journal"  -}}
{{- $isPostgres := eq $backend "postgres" -}}
{{- $isRedis    := eq $backend "redis"    -}}
---
apiVersion: apps/v1
kind: {{ if $isJournal }}StatefulSet{{ else }}Deployment{{ end }}
metadata:
  name: entroq
  namespace: entroq-system
  labels:
    {{- include "entroq.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "entroq.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "entroq.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: entroq
      containers:
      - name: entroq
        image: {{ include "entroq.serverImage" . }}
        imagePullPolicy: {{ .Values.entroq.images.pullPolicy }}
        args:
        - serve
        - --port={{ .Values.entroq.service.grpcPort }}
        - --http_port={{ .Values.entroq.service.httpPort }}
        {{- if $usesAuthz }}
        - --authn=jwt
        - --auth_jwks_url={{ .Values.entroq.auth.jwksUrl }}
        {{- if .Values.entroq.auth.jwksTokenFile }}
        - --auth_jwks_token_file={{ .Values.entroq.auth.jwksTokenFile }}
        {{- end }}
        - --auth_issuer={{ .Values.entroq.auth.issuer }}
        - --auth_audience={{ .Values.entroq.auth.audience }}
        - --auth_ca_file={{ .Values.entroq.auth.caFile }}
        - --auth_token_cache_ttl={{ .Values.entroq.auth.tokenCacheTTL }}
        - --auth_token_cache_entries={{ .Values.entroq.auth.tokenCacheEntries }}
        - --auth_jwks_cache_ttl={{ .Values.entroq.auth.jwksCacheTTL }}
        - --auth_jwks_refresh_interval={{ .Values.entroq.auth.jwksRefreshInterval }}
        - --auth_http_timeout={{ .Values.entroq.auth.httpTimeout }}
        - --authz={{ $authzStrategy }}
        {{- if $usesMesh }}
        - --mesh_policy_file=/etc/entroq/mesh/mesh.json
        - --mesh_update_subject=system:serviceaccount:eqk8s-system:eqk8s-controller-manager
        {{- else if $usesOPA }}
        - --opa_url={{ .Values.entroq.authorization.opaUrl }}
        {{- if .Values.entroq.authorization.opaPath }}
        - --opa_path={{ .Values.entroq.authorization.opaPath }}
        {{- end }}
        {{- end }}
        {{- else }}
        - --authn=none
        - --authz=none
        {{- end }}
        {{- if $isJournal }}
        - --journal={{ .Values.entroq.storage.mountPath }}
        - --mkdir
        - --periodic_snapshot=1h
        - --journal_cleanup
        {{- else if $isPostgres }}
        - --dbaddr={{ .Values.entroq.postgres.addr }}
        - --dbname={{ .Values.entroq.postgres.database }}
        - --dbuser={{ .Values.entroq.postgres.user }}
        {{- if .Values.entroq.postgres.initSchema }}
        - --init_schema
        {{- end }}
        {{- else if $isRedis }}
        - --addr={{ .Values.entroq.redis.addr }}
        - --db={{ .Values.entroq.redis.db }}
        {{- end }}
        {{- if $isPostgres }}
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "entroq.postgresSecretName" . }}
              key: password
        {{- else if $isRedis }}
        env:
        - name: EQ_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "entroq.redisSecretName" . }}
              key: password
        {{- end }}
        ports:
        - containerPort: {{ .Values.entroq.service.grpcPort }}
          name: grpc
        {{- if $usesMesh }}
        - containerPort: {{ .Values.entroq.service.httpPort }}
          name: http
        {{- end }}
        readinessProbe:
          tcpSocket:
            port: {{ .Values.entroq.service.grpcPort }}
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          {{- toYaml .Values.entroq.resources.entroq | nindent 10 }}
        {{- if or $isJournal $usesMesh }}
        volumeMounts:
        {{- if $isJournal }}
        - name: journal
          mountPath: {{ .Values.entroq.storage.mountPath }}
        {{- end }}
        {{- if $usesMesh }}
        - name: mesh-policy
          mountPath: /etc/entroq/mesh
          readOnly: true
        {{- end }}
        {{- end }}

      {{- if $usesOPA }}
      - name: opa
        image: "{{ .Values.entroq.opa.image.repository }}:{{ .Values.entroq.opa.image.tag }}"
        imagePullPolicy: {{ .Values.entroq.opa.image.pullPolicy }}
        args:
        - run
        - --server
        - --addr=0.0.0.0:{{ .Values.entroq.service.opaPort }}
        {{- $extra := include "entroq.opaExtraArgs" . | trim }}
        {{- if $extra }}
        {{- $extra | nindent 8 }}
        {{- end }}
        - /rego/core-entroq-authz.rego
        - /rego/core-entroq-namespaces.rego
        - /rego/core-entroq-queues.rego
        - /rego/k8s-entroq-permissions.rego
        - /rego/k8s-entroq-user.rego
        ports:
        - containerPort: {{ .Values.entroq.service.opaPort }}
          name: http
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.entroq.service.opaPort }}
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          {{- toYaml .Values.entroq.resources.opa | nindent 10 }}
        volumeMounts:
        - name: opa-rego
          mountPath: /rego
          readOnly: true
      {{- end }}

      {{- if or $usesOPA $usesMesh }}
      volumes:
      {{- if $usesOPA }}
      - name: opa-rego
        configMap:
          name: opa-rego
      {{- end }}
      {{- if $usesMesh }}
      - name: mesh-policy
        configMap:
          name: entroq-mesh
      {{- end }}
      {{- end }}
  {{- if $isJournal }}
  volumeClaimTemplates:
  - metadata:
      name: journal
    spec:
      accessModes: ["ReadWriteOnce"]
      {{- if .Values.entroq.storage.storageClass }}
      storageClassName: {{ .Values.entroq.storage.storageClass | quote }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.entroq.storage.size }}
  {{- end }}
{{- end }}
