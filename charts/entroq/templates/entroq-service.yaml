{{- if .Values.entroq.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: entroq
  namespace: entroq-system
  labels:
    {{- include "entroq.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  selector:
    {{- include "entroq.selectorLabels" . | nindent 4 }}
  ports:
  - name: grpc
    port: {{ .Values.entroq.service.grpcPort }}
    targetPort: {{ .Values.entroq.service.grpcPort }}
    protocol: TCP
  {{- if or (eq .Values.entroq.authorization.strategy "mesh") .Values.entroq.metrics.serviceMonitor.enabled }}
  - name: http
    port: {{ .Values.entroq.service.httpPort }}
    targetPort: {{ .Values.entroq.service.httpPort }}
    protocol: TCP
  {{- end }}
  {{- if eq .Values.entroq.authorization.strategy "opahttp" }}
  - name: opa
    port: {{ .Values.entroq.service.opaPort }}
    targetPort: {{ .Values.entroq.service.opaPort }}
    protocol: TCP
  {{- end }}
{{- end }}
