{{- if .Values.entroq.enabled }}
# OPA Rego policy files. JWT verification is performed by EntroQ, so this
# ConfigMap contains authorization policy only and no identity-provider secrets.
# Run 'make helm-sync' from the repo root to refresh these from source.
apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-rego
  namespace: entroq-system
  labels:
    {{- include "entroq.labels" . | nindent 4 }}
data:
  {{- range $path, $content := .Files.Glob "files/rego/*.rego" }}
  {{ base $path }}: |
    {{- $content | toString | nindent 4 }}
  {{- end }}
{{- end }}
