apiVersion: entroq.entroq.io/v1alpha1
kind: EntroQQueue
metadata:
  name: greetings-policy
  namespace: greetings
spec:
  queues:
  # svc-b's inbox: only svc-a (frontend) may call it
  - pattern: /greetings/svc-b/inbox
    matchType: Exact
    allowedCallers:
    - labels:
        tier: frontend

  # svc-c's inbox: only backend services may call it
  - pattern: /greetings/svc-c/inbox
    matchType: Exact
    allowedCallers:
    - labels:
        tier: backend

  # Receivers keep internal protocol-fencing docs. They are deliberately not
  # included in the autoscaling query.
  namespaces:
  - pattern: /greetings/svc-b/receiver-sessions/gc=
    matchType: Exact
    allowedCallers:
    - labels:
        app: svc-b
  - pattern: /greetings/svc-c/receiver-sessions/gc=
    matchType: Exact
    allowedCallers:
    - labels:
        app: svc-c
