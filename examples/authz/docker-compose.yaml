services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=entroq
      - POSTGRES_USER=entroq
      - POSTGRES_PASSWORD=entroq
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entroq -d entroq"]
      interval: 5s
      timeout: 5s
      retries: 5

  entroq:
    build:
      context: ../..
      dockerfile: ./cmd/eqpg/Dockerfile
    environment:
      - PGPASSWORD=entroq
    ports:
      - "37706:37706"
      - "9100:9100"
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_started
    command:
      - "serve"
      - "--dbaddr=postgres:5432"
      - "--dbname=entroq"
      - "--dbuser=entroq"
      - "--heartbeat=5s"
      - "--init_schema"
      - "--authn=jwt"
      - "--auth_jwks_file=/etc/entroq/jwks.json"
      - "--auth_issuer=entroq-example-issuer"
      - "--auth_audience=entroq-example"
      - "--authz=opahttp"
      - "--opa_url=http://opa:8181"
    volumes:
      - ./jwks.json:/etc/entroq/jwks.json:ro

  opa:
    image: openpolicyagent/opa:latest
    command:
      - "run"
      - "--addr=:8181"
      - "--server"
      - "--watch"
      - "--log-level=info"
      - "/etc/opa/core"
      - "/etc/opa/providers"
      - "/etc/opa/local"

    ports:
      - "8181:8181"
    volumes:
      # Core EntroQ Rego -- do not modify.
      - ../../pkg/authz/opadata/conf/core:/etc/opa/core:ro
      # Built-in standalone/OIDC permissions provider -- do not modify.
      - ../../pkg/authz/opadata/conf/providers/entroq:/etc/opa/providers:ro
      # Example users/roles authorization policy.
      - ./opa:/etc/opa/local:ro
